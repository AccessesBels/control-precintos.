<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDR Scruz - Sistema de Precintos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #080a11; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none; }
        .highlight-search { background-color: #3b82f6; color: white; border-radius: 4px; padding: 0 4px; font-weight: bold; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .login-title { background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN ELEGANTE -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-black">
        <div class="glass p-12 rounded-[2rem] shadow-2xl w-full max-w-md text-center transform transition-all">
            <div class="mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-blue-500/10 border border-blue-500/20 mb-6">
                    <i class="fas fa-fingerprint text-4xl text-blue-400"></i>
                </div>
                <h2 class="text-xs uppercase tracking-[0.3em] text-blue-400 font-bold mb-2">Acceso Privado</h2>
                <h1 class="text-3xl font-extrabold login-title">Registros de precintos de CDR Scruz</h1>
            </div>
            <div class="space-y-4 text-left">
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-4 text-slate-500"></i>
                    <input type="text" id="user" placeholder="Usuario" class="w-full bg-slate-900/50 border border-slate-800 p-4 pl-12 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/50 transition">
                </div>
                <div class="relative">
                    <i class="fas fa-key absolute left-4 top-4 text-slate-500"></i>
                    <input type="password" id="pass" placeholder="Contraseña" class="w-full bg-slate-900/50 border border-slate-800 p-4 pl-12 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/50 transition">
                </div>
                <button onclick="checkLogin()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:scale-[1.02] active:scale-95 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-500/10 transition-all duration-300">
                    Iniciar Sesión
                </button>
                <p id="errorMessage" class="text-red-400 text-sm text-center hidden font-medium">Credenciales no autorizadas</p>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardMain" class="hidden flex flex-col md:flex-row min-h-screen">
        <aside class="w-full md:w-72 bg-slate-950/50 border-r border-slate-800 p-8 flex flex-col">
            <div class="flex items-center gap-3 mb-12">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-600/20">
                    <i class="fas fa-satellite-dish text-white"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">CDR <span class="text-blue-500">Scruz</span></span>
            </div>
            <nav class="flex-1 space-y-2">
                <div class="flex items-center gap-3 text-blue-400 bg-blue-500/10 p-4 rounded-2xl border border-blue-500/20 shadow-inner">
                    <i class="fas fa-barcode"></i> <span class="font-semibold">Inventario</span>
                </div>
                <div onclick="exportarCSV()" class="flex items-center gap-3 text-slate-400 hover:bg-slate-800/50 p-4 rounded-2xl cursor-pointer transition">
                    <i class="fas fa-file-invoice"></i> <span>Reporte CSV</span>
                </div>
            </nav>
            <button onclick="logout()" class="mt-auto flex items-center gap-3 text-red-400/70 hover:text-red-400 p-4 hover:bg-red-500/5 rounded-2xl transition">
                <i class="fas fa-power-off"></i> <span>Desconectarse</span>
            </button>
        </aside>

        <main class="flex-1 p-8 lg:p-12 overflow-y-auto">
            <header class="flex justify-between items-end mb-12">
                <div>
                    <h2 class="text-4xl font-bold tracking-tight">Panel Técnico</h2>
                    <p id="fechaActual" class="text-slate-500 font-medium mt-2"></p>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-500 uppercase font-bold">Sesión Activa</span>
                    <p id="userNameDisplay" class="text-blue-400 font-bold"></p>
                </div>
            </header>

            <!-- Formulario Registro -->
            <section class="glass p-8 rounded-[2rem] mb-12">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Precinto(s)</label>
                        <input type="text" id="inputPrecinto" placeholder="ID o IDs separados" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Ubicación / NAP</label>
                        <input type="text" id="inputDetalle" placeholder="Zona o Cliente" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Estado</label>
                        <select id="inputEstado" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl focus:ring-2 focus:ring-blue-500 transition outline-none appearance-none">
                            <option value="Instalado">Instalado</option>
                            <option value="En Stock">En Stock</option>
                            <option value="Dañado">Dañado</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="registrarPrecinto()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all active:scale-95">
                            Guardar Datos
                        </button>
                    </div>
                </div>
            </section>

            <!-- Tabla -->
            <section class="glass rounded-[2rem] overflow-hidden">
                <div class="p-8 border-b border-slate-800 flex flex-col md:flex-row justify-between gap-4">
                    <h3 class="text-xl font-bold">Historial de Sellos (<span id="statTotal" class="text-blue-400">0</span>)</h3>
                    <div class="relative w-full md:w-72">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-500"></i>
                        <input type="text" id="busqueda" onkeyup="filtrarTabla()" placeholder="Buscar precinto..." class="w-full bg-slate-900 border border-slate-800 pl-12 pr-4 py-3 rounded-xl outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-900/50 text-slate-500 text-[10px] uppercase font-bold tracking-widest">
                            <tr>
                                <th class="p-6">Fecha Registro</th>
                                <th class="p-6">Identificación de Precinto</th>
                                <th class="p-6">Nodo / Ubicación</th>
                                <th class="p-6">Estado</th>
                                <th class="p-6 text-center">Gestión</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo" class="divide-y divide-slate-800/50"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        // CONFIGURACIÓN DE MULTIUSUARIOS
        const USUARIOS = {
            "SCRUZ": "Scruz31.",
            "GCON": "Gcon31.",
            "Invitado": "isp99"
        };

        function checkLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            
            if(USUARIOS[u] && USUARIOS[u] === p) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardMain').classList.remove('hidden');
                document.getElementById('userNameDisplay').innerText = u;
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('activeUser', u);
            } else {
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        }

        if(sessionStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardMain').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = sessionStorage.getItem('activeUser');
        }

        function logout() { sessionStorage.clear(); location.reload(); }

        let precintos = JSON.parse(localStorage.getItem('precintos_data')) || [];

        function actualizarDashboard() {
            const cuerpo = document.getElementById('tablaCuerpo');
            document.getElementById('statTotal').innerText = precintos.length;
            cuerpo.innerHTML = '';

            precintos.slice().reverse().forEach((p, index) => {
                const realIndex = precintos.length - 1 - index;
                cuerpo.innerHTML += `
                    <tr class="hover:bg-blue-500/5 transition group">
                        <td class="p-6 text-xs text-slate-500 font-medium">${p.fecha}</td>
                        <td class="p-6 font-mono font-bold text-slate-200">
                            <span class="num-span">${p.numero}</span>
                        </td>
                        <td class="p-6 text-sm font-semibold text-slate-400">${p.detalle}</td>
                        <td class="p-6">
                            <select onchange="editarEstado(${realIndex}, this.value)" class="bg-slate-900 border border-slate-700 text-[10px] p-2 rounded-lg outline-none cursor-pointer focus:ring-1 focus:ring-blue-500">
                                <option value="Instalado" ${p.estado === 'Instalado' ? 'selected' : ''}>Instalado</option>
                                <option value="En Stock" ${p.estado === 'En Stock' ? 'selected' : ''}>En Stock</option>
                                <option value="Dañado" ${p.estado === 'Dañado' ? 'selected' : ''}>Dañado</option>
                            </select>
                        </td>
                        <td class="p-6 text-center">
                            <button onclick="eliminar(${realIndex})" class="text-slate-700 hover:text-red-500 transition p-2 hover:bg-red-500/10 rounded-lg">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            localStorage.setItem('precintos_data', JSON.stringify(precintos));
        }

        function registrarPrecinto() {
            const num = document.getElementById('inputPrecinto').value;
            if(!num) return;
            precintos.push({
                fecha: new Date().toLocaleString(),
                numero: num,
                detalle: document.getElementById('inputDetalle').value || "No especificado",
                estado: document.getElementById('inputEstado').value
            });
            document.getElementById('inputPrecinto').value = '';
            document.getElementById('inputDetalle').value = '';
            actualizarDashboard();
        }

        function editarEstado(i, s) { 
            precintos[i].estado = s; 
            localStorage.setItem('precintos_data', JSON.stringify(precintos));
        }

        function eliminar(i) { if(confirm("¿Confirmas la eliminación definitiva?")) { precintos.splice(i, 1); actualizarDashboard(); } }

        function filtrarTabla() {
            const q = document.getElementById('busqueda').value.trim();
            const filas = document.querySelectorAll('#tablaCuerpo tr');
            
            filas.forEach(fila => {
                const celda = fila.querySelector('.num-span');
                const textoOriginal = celda.innerText;
                
                if (q === "") {
                    fila.style.display = "";
                    celda.innerHTML = textoOriginal;
                } else if (textoOriginal.toLowerCase().includes(q.toLowerCase())) {
                    fila.style.display = "";
                    const regex = new RegExp(`(${q})`, 'gi');
                    celda.innerHTML = textoOriginal.replace(regex, '<span class="highlight-search">$1</span>');
                } else {
                    fila.style.display = "none";
                }
            });
        }

        function exportarCSV() {
            let csv = "Fecha,Identificador,Ubicacion,Estado\n";
            precintos.forEach(p => csv += `${p.fecha},${p.numero},${p.detalle},${p.estado}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = window.URL.createObjectURL(blob);
            a.download = `CDR_Scruz_Reporte_${new Date().toLocaleDateString()}.csv`;
            a.click();
        }

        document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        actualizarDashboard();
    </script>
</body>
</html>
