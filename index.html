<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDR Scruz - Sistema Universal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#080a11] text-slate-200 min-h-screen">

    <div id="dashboardMain" class="flex flex-col md:flex-row min-h-screen">
        <aside class="w-full md:w-72 bg-slate-950/50 border-r border-slate-800 p-8">
            <h1 class="text-xl font-bold mb-10">CDR <span class="text-blue-500">Scruz</span></h1>
            <nav class="space-y-4">
                <div class="text-blue-400 bg-blue-500/10 p-4 rounded-2xl border border-blue-500/20"><i class="fas fa-barcode mr-2"></i> Inventario</div>
                <div onclick="location.reload()" class="cursor-pointer text-slate-400 p-4 hover:bg-slate-800 rounded-2xl"><i class="fas fa-sync mr-2"></i> Sincronizar Nube</div>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <p class="text-xs text-slate-500 uppercase font-bold">Total Precintos</p>
                    <h3 id="cardTotal" class="text-3xl font-extrabold mt-1">0</h3>
                </div>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-8 flex gap-4">
                <input id="in-id" type="text" placeholder="ID Precinto" class="bg-slate-950 p-3 rounded-xl border border-slate-800 w-full outline-none">
                <input id="in-ubi" type="text" placeholder="Ubicación" class="bg-slate-950 p-3 rounded-xl border border-slate-800 w-full outline-none">
                <button onclick="agregarNube()" class="bg-blue-600 px-8 py-3 rounded-xl font-bold">Guardar</button>
            </div>

            <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-800 text-slate-400 text-[10px] uppercase">
                        <tr><th class="p-6">Fecha</th><th class="p-6">ID</th><th class="p-6">Ubicación</th><th class="p-6">Acción</th></tr>
                    </thead>
                    <tbody id="tablaCuerpo" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const API_URL = "https://cdr-scruz-default-rtdb.firebaseio.com/registros.json";

        async function sincronizar() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const lista = data ? Object.values(data) : [];
                renderizar(lista);
            } catch(e) { alert("Error de conexión"); }
        }

        async function agregarNube() {
            const id = document.getElementById('in-id').value;
            const ubi = document.getElementById('in-ubi').value;
            if(!id) return;

            const res = await fetch(API_URL);
            let lista = await res.json() || [];
            if(!Array.isArray(lista)) lista = Object.values(lista);

            lista.push({ id, ubi, fecha: new Date().toLocaleDateString() });
            await fetch(API_URL, { method: 'PUT', body: JSON.stringify(lista) });
            
            document.getElementById('in-id').value = "";
            document.getElementById('in-ubi').value = "";
            sincronizar();
        }

        function renderizar(lista) {
            document.getElementById('cardTotal').innerText = lista.length;
            document.getElementById('tablaCuerpo').innerHTML = lista.map((p, index) => `
                <tr>
                    <td class="p-6">${p.fecha}</td>
                    <td class="p-6 font-bold">${p.id}</td>
                    <td class="p-6">${p.ubi}</td>
                    <td class="p-6"><button onclick="eliminar(${index})" class="text-red-500">Eliminar</button></td>
                </tr>
            `).join('');
        }

        async function eliminar(index) {
            const res = await fetch(API_URL);
            let lista = await res.json();
            lista.splice(index, 1);
            await fetch(API_URL, { method: 'PUT', body: JSON.stringify(lista) });
            sincronizar();
        }

        sincronizar();
    </script>
</body>
</html>
