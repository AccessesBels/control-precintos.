<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA BLINDADO CDR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center">
    <div id="status" class="text-xl font-bold">Iniciando sistema...</div>

    <script>
        const DB_URL = "https://cdr-scruz-default-rtdb.firebaseio.com";

        async function iniciarSistemaBlindado() {
            try {
                document.getElementById('status').innerText = "Conectando con base de datos...";
                
                // 1. Intentar obtener datos ANTES de cualquier lógica de interfaz
                const respuesta = await fetch(`${DB_URL}/precintos.json`);
                const data = await respuesta.json();

                if (data) {
                    console.log("Data recuperada con éxito:", data);
                    localStorage.setItem('backup_precintos', JSON.stringify(Object.values(data)));
                    document.getElementById('status').innerText = "Data cargada. Redirigiendo...";
                    window.location.reload(); // Recarga una sola vez con los datos en cache
                } else {
                    document.getElementById('status').innerText = "Sin datos en servidor. Iniciando modo seguro.";
                    // NO BORRAMOS, solo cargamos lo que haya en local
                    setTimeout(() => window.location.href = "index.html", 2000);
                }
            } catch (err) {
                document.getElementById('status').innerText = "Error de conexión. Usando modo offline.";
                setTimeout(() => window.location.href = "index.html", 2000);
            }
        }

        // Ejecutar inmediatamente
        iniciarSistemaBlindado();
    </script>
</body>
</html>
